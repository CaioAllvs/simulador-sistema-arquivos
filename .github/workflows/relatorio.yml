name: Validar Java e atualizar relatorio PDF

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "src/**"
      - "scripts/exportar_pdf.py"
      - ".github/workflows/relatorio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar-e-exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar e testar simulador
        run: |
          javac src/*.java
          java -cp src TesteSimulador
      - name: Instalar dependencias para PDF
        run: python -m pip install --disable-pip-version-check mistune weasyprint
      - name: Gerar PDF atualizado
        run: python scripts/exportar_pdf.py
      - name: Publicar PDF no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Relatorio_Simulador_Sistema_Arquivos.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza relatorio PDF a partir do README"
            git push
          fi
